name: ArchLens Rollback

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID do deploy para fazer rollback"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get deployment SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ inputs.run_id }} \
            --json databaseId,createdAt,headSha,displayTitle \
            --jq '{
              id: .databaseId,
              date: .createdAt,
              sha: .headSha,
              commit: .displayTitle
            }'

      - name: List successful deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --workflow deploy.yml \
            --status success \
            --limit 10 \
            --json databaseId,createdAt,headSha,displayTitle \
            --jq '.[] | {
              id: .databaseId,
              date: .createdAt,
              sha: .headSha,
              commit: .displayTitle
            }'