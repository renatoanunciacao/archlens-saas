name: ArchLens Rollback

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID do deploy para fazer rollback"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get deployment SHA
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh run view ${{ inputs.run_id }} \
            --json headSha \
            --jq '.headSha')

          echo "Selected SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Configure Aws Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::161958365524:role/GitHubActionsArchLensRole
          aws-region: us-east-1

      - name: Verify image in ECR
        env:
          AWS_REGION: us-east-1
          ECR_REPOSITORY: archlens
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${{ steps.deployment.outputs.sha }}" \
            --region "$AWS_REGION"

      - name: Rollback via SSM
        id: rollback
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0bb23763a102c7075" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin 161958365524.dkr.ecr.us-east-1.amazonaws.com",
              "sudo docker pull 161958365524.dkr.ecr.us-east-1.amazonaws.com/archlens:${{ steps.deployment.outputs.sha }}",
              "sudo docker stop archlens || true",
              "sudo docker rm archlens || true",
              "sudo docker run -d --name archlens -p 3000:3000 -e NEXTAUTH_SECRET=\"${{ secrets.NEXTAUTH_SECRET }}\" -e NEXTAUTH_URL=\"${{ secrets.NEXTAUTH_URL }}\" 161958365524.dkr.ecr.us-east-1.amazonaws.com/archlens:${{ steps.deployment.outputs.sha }}"
            ]' \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0bb23763a102c7075" \
              --region us-east-1 \
              --query "Status" \
              --output text)

            echo "SSM Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Rollback realizado com sucesso!"
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "Rollback falhou com status: $STATUS"
              exit 1
            fi

            sleep 10
          done

          echo "Timeout aguardando execução do SSM"
          exit 1

      - name: List successful deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --workflow deploy.yml \
            --status success \
            --limit 10 \
            --json databaseId,createdAt,headSha,displayTitle \
            --jq '.[] | {
              id: .databaseId,
              date: .createdAt,
              sha: .headSha,
              commit: .displayTitle
            }'