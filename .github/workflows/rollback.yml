name: ArchLens Rollback

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID do deploy para fazer rollback"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get deployment SHA
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh run view ${{ inputs.run_id }} \
            --json headSha \
            --jq '.headSha')

          echo "Selected SHA: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Configure Aws Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::161958365524:role/GitHubActionsArchLensRole
          aws-region: us-east-1

      - name: Verify image in ECR
        env:
          AWS_REGION: us-east-1
          ECR_REPOSITORY: archlens
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${{ steps.deployment.outputs.sha }}" \
            --region "$AWS_REGION"

      - name: List successful deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --workflow deploy.yml \
            --status success \
            --limit 10 \
            --json databaseId,createdAt,headSha,displayTitle \
            --jq '.[] | {
              id: .databaseId,
              date: .createdAt,
              sha: .headSha,
              commit: .displayTitle
            }'